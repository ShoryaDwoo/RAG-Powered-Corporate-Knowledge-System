name: PDF Processing Pipeline

on:
  push:
    paths:
      - "pdf's/**"  # Only run if new PDFs added
  workflow_dispatch:  # Manual trigger

jobs:
  process_pdfs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Clean pip cache
        run: pip cache purge

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run ingestion & chunking
        run: python scripts/ingest_chunk.py

      - name: Run summarization
        run: python scripts/agentic_chunking.py

      - name: Embed & upsert to Pinecone
        run: python scripts/embedd_upload.py

      - name: Notify completion
        run: echo "Pipeline completed successfully"
